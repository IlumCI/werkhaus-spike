name: machine
# The runner as a whole machine: a metasearch engine, a fork of Robinhood
# Chain, and a browser, all inside one job.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  machine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: SearXNG
        run: |
          mkdir -p sx
          cat > sx/settings.yml <<YML
          use_default_settings: true
          server:
            secret_key: "$(openssl rand -hex 32)"
            limiter: false
          search:
            formats: [html, json]
          YML
          t0=$(date +%s)
          docker run -d --name sx -p 8888:8080 -v "$PWD/sx:/etc/searxng" docker.io/searxng/searxng:latest > /dev/null
          for _ in $(seq 1 90); do curl -sf localhost:8888/healthz > /dev/null && break; sleep 1; done
          echo "- SearXNG up in $(( $(date +%s) - t0 ))s (incl. image pull)" | tee -a "$GITHUB_STEP_SUMMARY"
          for q in "robinhood chain launchpad" "uniswap v4 hooks" "staking rewards contract"; do
            curl -s "localhost:8888/search?q=$(echo $q | sed 's/ /+/g')&format=json" \
              | jq -r --arg q "$q" '"- \"\($q)\": \(.results|length) results from \([.results[].engine]|unique|join(", ")); unresponsive: \(.unresponsive_engines|map(.[0])|join(", "))"' | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Anvil fork of Robinhood Chain
        run: |
          t0=$(date +%s)
          anvil --fork-url https://rpc.mainnet.chain.robinhood.com --port 8545 --silent &
          for _ in $(seq 1 60); do cast chain-id --rpc-url http://127.0.0.1:8545 > /dev/null 2>&1 && break; sleep 1; done
          {
            echo "- anvil fork up in $(( $(date +%s) - t0 ))s"
            echo "- chain id $(cast chain-id --rpc-url http://127.0.0.1:8545), block $(cast block-number --rpc-url http://127.0.0.1:8545)"
            echo "- PoolManager code size on the fork: $(cast codesize 0x8366a39CC670B4001A1121B8F6A443A643e40951 --rpc-url http://127.0.0.1:8545) bytes"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Chromium
        run: |
          CHROME=$(command -v google-chrome || command -v chromium)
          "$CHROME" --version | tee -a "$GITHUB_STEP_SUMMARY"
          "$CHROME" --headless=new --no-sandbox --hide-scrollbars --screenshot=desk-1440.png --window-size=1440,900 https://werkha.us
          "$CHROME" --headless=new --no-sandbox --hide-scrollbars --screenshot=desk-375.png --window-size=375,812 https://werkha.us
          ls -la desk-*.png | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: desk-*.png
